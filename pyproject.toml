[tool.poetry]
name = "esg-rag"
version = "1.0.0"
description = "Evidence-aware, Structure-Guided Retrieval-Augmented Generation"
authors = ["ESG-RAG Authors"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "esg_rag" }, { include = "graphrag" }]

[tool.poetry.scripts]
graphrag = "graphrag.cli.main:app"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
aiofiles = "^24.1.0"
aiolimiter = "^1.1.0"
azure-identity = "^1.17.1"
azure-search-documents = "^11.4.0"
azure-storage-blob = "^12.22.0"
datashaper = "^0.0.49"
devtools = "^0.12.2"
environs = "^11.0.0"
faiss-cpu = "1.9.0"
future = "^1.0.0"
graspologic = "^3.4.1"
json-repair = "^0.30.0"
lancedb = "^0.13.0"
matplotlib = "^3.9.0"
networkx = "^3.4"
nltk = "3.9.1"
numpy = "^1.26.4"
openai = "^1.54.0"
pandas = "^2.2.3"
pyaml-env = "^1.2.1"
pyarrow = "^15.0.0"
pydantic = "^2.9.2"
python-dotenv = "^1.0.0"
pyyaml = "^6.0.2"
regex = "^2024.9.11"
rich = "^13.9.4"
scikit-learn = "^1.5.2"
tenacity = "^9.0.0"
tiktoken = "^0.7.0"
tqdm = "^4.66.6"
typer = "^0.12.5"
typing-extensions = "^4.12.2"
umap-learn = "^0.5.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

